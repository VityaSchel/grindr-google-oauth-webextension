name: check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: grindr-google-oauth-webextension-check-${{ forgejo.event.pull_request.number || forgejo.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ["fork", "toolchain", "8c16g", "hetzner"]
    timeout-minutes: 20
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      PR_NUMBER: ${{ forgejo.event.pull_request.number }}
      EXPECTED_SHA: ${{ forgejo.event.pull_request.head.sha }}
      CI_WORKSPACE: /opt/grindr-google-oauth-webextension-ci
    steps:
      - name: Verify CI environment
        run: |
          set -euo pipefail

          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by PR code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          set -euo pipefail

          : "${CI_WORKSPACE:?}"
          rm -rf "$CI_WORKSPACE"
          mkdir -p "$CI_WORKSPACE"
          cd "$CI_WORKSPACE"

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          if [ -n "${PR_NUMBER:-}" ]; then
            git fetch -q --depth 1 origin "refs/pull/${PR_NUMBER}/head"
          else
            git fetch -q --depth 1 origin "$FORGEJO_SHA"
          fi
          git checkout -q FETCH_HEAD
          [ -z "${EXPECTED_SHA:-}" ] || [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] \
            || { echo "FATAL: PR head moved since approval (want $EXPECTED_SHA, got $(git rev-parse HEAD))"; exit 1; }

      - name: Install JS dependencies
        run: cd "$CI_WORKSPACE" && bun install --frozen-lockfile --no-summary

      - name: Lint
        run: cd "$CI_WORKSPACE" && bun run lint

      - name: Formatting
        run: cd "$CI_WORKSPACE" && bun run check:format

      - name: Shared config
        run: cd "$CI_WORKSPACE" && bun run check:config

      - name: Tests
        run: cd "$CI_WORKSPACE" && bun run test

      - name: Build
        run: |
          set -euo pipefail

          if ! command -v zip >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends zip
          fi
          cd "$CI_WORKSPACE"
          ./build.sh

      - name: Lint Firefox package
        run: cd "$CI_WORKSPACE" && bun run lint:firefox
